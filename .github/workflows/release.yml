# release.yml: a pushed vX.Y.Z tag publishes the eight @agent-ui-kit/* packages to npm at X.Y.Z and
# creates the GitHub release for the tag (T-0465, Kim 2026-10-25: "publish via git actions and tagging").
# With ci.yml (PRs) this is the second workflow GitHub runs automatically; deploy-docs.yml stays manual.
#
# The publish step is the same command a local release runs, `npm run publish:packages -- <version>`
# (scripts/publish/publish-packages.mjs): it builds, transforms and publishes all eight in lockstep and
# skips any package already live at that version, so re-running a failed job resumes the fleet.
#
# Auth: npm trusted publishing (GitHub OIDC, T-0466; the NPM_TOKEN route failed with a 404 on the scope at the
# first v0.2.0 publish). No token exists anywhere in this workflow: the publish job asks GitHub for an OIDC
# identity (`id-token: write`) and npm exchanges it for a short-lived publish credential, so a set NODE_AUTH_TOKEN
# would only get in its way. The Set up Node step passes no `registry-url`: npm already defaults to
# https://registry.npmjs.org/, which is the OIDC audience it asks for (`npm:registry.npmjs.org`). Requirements:
# npm CLI 11.5.1 or newer (the "Require an npm CLI that can publish with OIDC" step enforces it), a GitHub-hosted
# runner, and a trusted publisher registered on npmjs.com for each of the eight packages (package Settings,
# Trusted Publisher, GitHub Actions) with these fields, all case-sensitive and exact: organization or user
# `kimgranlund` (the GitHub owner, not the npm user `kimgish`), repository `agent-ui`, workflow filename
# `release.yml` (the bare filename, no `.github/workflows/` path), environment left empty (the job names none),
# and the allowed action "npm publish" ticked (npm's docs: an entry made after 2026-09-03 allows only
# `npm stage publish` by default, and the script runs a direct publish). Provenance is automatic under trusted
# publishing and needs a public repo whose URL matches each package's `repository.url` (the script writes it).
#
# When the exchange fails, npm does not say why: it logs the registry's reason at `verbose`, then stops with
# ENEEDAUTH (T-0471: run 40341014351 on v0.2.0 reached the exchange request, then hit ENEEDAUTH with the reason
# discarded at the default log level). So the publish step runs npm at `verbose`, where the reason prints as
# `npm verbose oidc Failed token exchange request with body message: ...`, and a failed publish uploads npm's
# full debug logs as the `npm-logs` artifact.
#
# Release notes: `.github/release-notes/<tag>.md` when that file exists, else GitHub's generated notes.
# The workflow never pushes commits.
name: Release

on:
  push:
    tags: ['v*.*.*']

# Never cancel a publish mid-fleet; a second push of the same tag queues behind the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The tag glob `v*.*.*` also matches `v1.2.3-rc.1` or `v1.2.3.4`; only a strict vX.Y.Z passes.
      # Prereleases are refused because the script publishes without `--tag`, so one would land as `latest`.
      - name: Read version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::not a tag push (ref type '$GITHUB_REF_TYPE')"
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not a vX.Y.Z semver tag"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships npm 11, but the floor is checked, not assumed:
      # an older npm is upgraded, and the step fails if the result is still below the floor.
      - name: Require an npm CLI that can publish with OIDC
        shell: bash
        run: |
          floor="11.5.1"
          have="$(npm --version)"
          if [[ "$(printf '%s\n%s\n' "$floor" "$have" | sort -V | head -n1)" != "$floor" ]]; then
            echo "npm $have is older than $floor; upgrading"
            npm install --global "npm@^$floor"
            have="$(npm --version)"
          fi
          if [[ "$(printf '%s\n%s\n' "$floor" "$have" | sort -V | head -n1)" != "$floor" ]]; then
            echo "::error::npm $have cannot publish with OIDC (needs $floor or newer)"
            exit 1
          fi
          echo "npm $have meets the trusted publishing floor ($floor)"

      - name: Install dependencies
        run: npm ci

      # No token reaches npm, which authenticates through the job's OIDC identity. `verbose` makes a refused OIDC
      # exchange print the registry's reason instead of a bare ENEEDAUTH (see the header).
      - name: Publish the eight packages
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm run publish:packages -- ${{ steps.version.outputs.version }}

      # npm's debug logs hold every level (npm redacts tokens); the runner and its files are gone after the job.
      - name: Keep the npm debug logs of a failed publish
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: ~/.npm/_logs/
          retention-days: 14
          if-no-files-found: ignore

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
            exit 0
          fi
          notes=".github/release-notes/$TAG.md"
          if [[ -f "$notes" ]]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A force-push mid-review makes the stale review's spend worthless — cancel it, keep the newest.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # T-0153 (temporary): which credential does the API reject, and with what? Prints status and
      # error type only, never a secret. Remove with the fix.
      - name: Probe credentials
        env:
          PROBE_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROBE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          body='{"model":"claude-sonnet-5-5","max_tokens":8,"messages":[{"role":"user","content":"ok"}]}'
          probe() {
            code=$(curl -sS -o probe.out -w '%{http_code}' https://api.anthropic.com/v1/messages \
              -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' "${@:2}" -d "$body") || code=curl-failed
            echo "$1: HTTP $code $(jq -r '.error | "\(.type): \(.message)"' probe.out 2>/dev/null | cut -c1-200)"
          }
          probe api-key -H "x-api-key: $PROBE_KEY"
          probe oauth -H "Authorization: Bearer $PROBE_OAUTH" -H 'anthropic-beta: oauth-2025-04-20'
          exit 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'adiahealth'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Effort goes through the settings input — inline JSON in claude_args
          # loses its quotes at arg-split time and crashes the run.
          settings: '{"effortLevel": "xhigh"}'
          claude_args: '--model claude-sonnet-5-5 --allowedTools "mcp__github_inline_comment__create_inline_comment"'

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A force-push mid-review makes the stale review's spend worthless — cancel it, keep the newest.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          # T-0192: an org-level key needs the workspace header; Claude Code reads this env var. Empty when the
          # secret is unset, so a scoped key is unaffected.
          ANTHROPIC_CUSTOM_HEADERS: ${{ secrets.ANTHROPIC_WORKSPACE_ID != '' && format('anthropic-workspace-id: {0}', secrets.ANTHROPIC_WORKSPACE_ID) || '' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: 'adiahealth'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Effort goes through the settings input — inline JSON in claude_args
          # loses its quotes at arg-split time and crashes the run.
          settings: '{"effortLevel": "xhigh"}'
          # T-0191: the action hides the CLI result text; the failing run shows only
          # is_error:true at 0 cost, so print it to read the real error.
          show_full_output: true
          claude_args: '--model claude-sonnet-5-5 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
